name: Deploy Automation & Security Reports to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  deploy-pages:
    name: Build & Publish GitHub Pages Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Collect All Reports & Dashboard Assets
        run: |
          mkdir -p _site
          cp -r automation/reports/* _site/ || true
          cp selenium-tests/selenium_test_report.xlsx _site/ || true
          cp appium-tests/appium_test_report.xlsx _site/ || true
          cp load-tests/load_test_report.xlsx _site/ || true
          cp security-tests/backend_security_report.xlsx _site/ || true

      - name: Deploy Reports to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
