version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16
    container_name: medipredict-db
    environment:
      POSTGRES_DB: medipredict_db
      POSTGRES_USER: medipredict
      POSTGRES_PASSWORD: medipredict123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  # Spring Boot Application
  backend:
    build: .
    container_name: medipredict-backend
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/medipredict_db
      - SPRING_DATASOURCE_USERNAME=medipredict
      - SPRING_DATASOURCE_PASSWORD=medipredict123
      - JWT_SECRET=mysupersecretkey12345678901234567890
      # Allow mobile connection with wildcard CORS origin
      - CORS_ORIGINS=*
    depends_on:
      - postgres
      - ml-service
    restart: unless-stopped

  # Machine Learning Microservice (FastAPI)
  ml-service:
    build: ../ML_Service
    container_name: medipredict-ml
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  postgres-data:
